<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Vector Factory</title>

    <link rel="stylesheet" href="css/app.css" />
    <script src="lib/CSInterface-4.0.0.js"></script>
    <script src="js/app.js"></script>
  </head>

  <body>
    <div id="app">
      <!-- Tools panel: existing Generate / Export workflow (unchanged) -->
      <div id="tab-tools">
        <section class="panel-section">
          <div class="section-title">Element</div>
          <div id="previewBox">
            <img id="preview" alt="Current element preview" />
            <div class="preview-empty">No preview</div>
          </div>
          <button id="setElement">Set Element</button>
        </section>

        <section class="panel-section">
          <div class="section-title">Generate</div>
          <label class="checkbox-label">
            <input id="allowMirroring" type="checkbox" checked />
            Allow Mirroring
          </label>
          <div class="row">
            <button id="clear" class="export">Clear</button>
            <button id="toggle" class="export">Hide</button>
            <button id="remapBtn" class="export">Remap</button>
          </div>
          <button id="generate" class="primary gen-full">Generate all</button>
          <div class="row">
            <button id="generateS" class="export">Blacks</button>
            <button id="generateSK" class="export">Colors</button>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-title">Export</div>
          <input id="prefix" type="text" placeholder="Filename Prefix" />
          <div class="path-row">
            <input
              id="exportPath"
              type="text"
              placeholder="Export folder"
              readonly
            />
            <button id="choosePathBtn" class="export">Select path</button>
          </div>
          <label class="checkbox-label">
            <input id="includeJpg" type="checkbox" />
            Include JPG preview
          </label>
          <label class="checkbox-label">
            <input id="enableCsv" type="checkbox" />
            Enable CSV
          </label>
          <button id="exportSelectedBtn" class="export">
            Select for Export
          </button>
          <button id="exportBtn" class="export">Export</button>
          <button id="exportCsvAllBtn" class="export">CSV All</button>
        </section>
      </div>

      <div id="status"><span class="status-spinner" id="statusSpinner"></span><span id="statusText">Ready</span><span class="status-dots" id="statusDots"><span></span><span></span><span></span></span></div>
    </div>

    <!-- Export Selected: choose which artboards to export -->
    <div id="abOverlay" class="overlay hidden">
      <div class="modal">
        <div class="modal-title">Export Selected Artboards</div>
        <div id="abList" class="ab-list"></div>
        <div class="modal-row">
          <button id="abSelectAll" class="secondary small">Select All</button>
          <button id="abDeselectAll" class="secondary small">
            Deselect All
          </button>
        </div>
        <div class="modal-actions">
          <button id="abExportCsv" class="export">CSV Selected</button>
          <div class="modal-actions-row">
            <button id="abCancel" class="secondary">Cancel</button>
            <button id="abExport" class="primary">Export</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Remap Placeholders: rename S/SK* targets inside the selection -->
    <div id="remapOverlay" class="overlay hidden">
      <div class="modal">
        <div class="modal-title">Remap Placeholders</div>
        <div id="remapList" class="remap-list"></div>
        <div class="modal-actions">
          <button id="remapCancel" class="secondary">Cancel</button>
          <button id="remapRename" class="primary">Rename</button>
        </div>
      </div>
    </div>
  </body>
</html>
